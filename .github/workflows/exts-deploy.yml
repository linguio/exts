name: Exts Publish
run-name: Exts Publish · ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Website 部署官网；Release 生成扩展 ZIP 与 macOS DMG 草稿'
        required: true
        type: choice
        default: Website
        options:
          - Website
          - Release

permissions:
  contents: read

concurrency:
  group: exts-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  website-build:
    name: Website · Build
    if: github.ref == 'refs/heads/main' && inputs.target == 'Website'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout website commit
        uses: actions/checkout@v5.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck website
        run: pnpm --filter @exts/website typecheck
      - name: Build website
        run: pnpm web:build
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist/build/exts-web

  website-deploy:
    name: Website · Deploy
    if: github.ref == 'refs/heads/main' && inputs.target == 'Website'
    needs: website-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

  release:
    name: Release · ZIP & DMG
    if: github.ref == 'refs/heads/main' && inputs.target == 'Release'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Read product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/release/exts-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/release/exts-mac.dmg" >> "$GITHUB_OUTPUT"
      - name: Check tag and release conflicts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | [.tag_name, (if .draft then "draft" else "published" end), .html_url] | @tsv')"
          while IFS=$'\t' read -r release_tag release_state release_url; do
            if [[ "$release_tag" == "$TAG" ]]; then
              if [[ "$release_state" == 'draft' ]]; then
                echo "草稿 Release $TAG 已存在，禁止重复创建或覆盖：$release_url" >&2
                echo '请检查已有草稿和附件；内容正确时直接验收并公开。若草稿不完整，请先人工确认并处理旧草稿，再重新运行 Action；不会自动删除草稿或标签。' >&2
              else
                echo "Release $TAG 已正式发布，禁止覆盖：$release_url" >&2
                echo '若要发布新内容，请提升根 package.json 的产品版本，提交并推送后重新运行 Action；不要重跑同版本。' >&2
              fi
              exit 1
            fi
          done <<< "$releases"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            target="$(git rev-parse "$TAG^{commit}")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG 指向其他提交（$target），当前提交为 $GITHUB_SHA，禁止移动标签。" >&2
              echo '请核对所选提交和已有标签；若要发布新版本，请提升根 package.json 的产品版本，提交并推送后重新运行 Action。不会自动删除或移动已有标签。' >&2
              exit 1
            fi
          fi
      - name: Setup native build tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          archive="$RUNNER_TEMP/xcodegen-2.46.0.zip"
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$archive"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/exts-native-tools"
          tool_bin="$RUNNER_TEMP/exts-native-tools/xcodegen/bin"
          test "$("$tool_bin/xcodegen" --version)" = 'Version: 2.46.0'
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release behavior
        run: node --test tests/build-release.test.mjs tests/extension-release.test.mjs apps/desktop/tests/scripts/desk.test.mjs
      - name: Test stable extension publication
        run: pnpm --filter @linguio/wxt-stable-output test
      - name: Test extension
        run: pnpm --filter @exts/extension test
      - name: Typecheck extension
        run: pnpm --filter @exts/extension typecheck
      - name: Typecheck website
        run: pnpm --filter @exts/website typecheck
      - name: Test Photos logic
        working-directory: apps/desktop
        env:
          EXTS_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodegen generate
          xcodebuild test -project exts.xcodeproj -scheme exts \
            -destination 'platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/dist/.cache/desktop/DerivedData" \
            -only-testing:extsTests/MediaGroupingTests \
            -only-testing:extsTests/ThumbnailSchedulerTests \
            -only-testing:extsTests/AppStoragePathsTests \
            -only-testing:extsTests/DownloadCoordinatorTests \
            "EXTS_BUILD_VERSION=$EXTS_BUILD_VERSION" CODE_SIGNING_ALLOWED=NO
      - name: Build and package ZIP and DMG
        run: pnpm release
      - name: Check bundle budget
        run: pnpm --filter @exts/extension check:bundle-size
      - name: Create tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          test -s "$ZIP"
          test -s "$DMG"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$TAG"
          cat > "$RUNNER_TEMP/exts-release-notes.md" <<'NOTES'
          Exts 包含 Chrome／Edge 浏览器扩展和 macOS 27 桌面应用 Photos。

          下载 exts-chrome.zip 附件，解压后在 Chrome 扩展管理页开启开发者模式，选择“加载已解压的扩展程序”。经实际验收后也可在 Edge 中加载。

          下载 exts-mac.dmg，打开后将 exts.app 拖入 Applications，再从应用程序目录启动。桌面包仅用于本人在 macOS 27 上使用，未接入开发者分发签名或公证。

          两个安装包使用相同产品版本；即使扩展没有功能更新，每次 Release 仍同时包含两包。GitHub 自动生成的 Source code 压缩包是源码，不是安装包。
          NOTES
          gh release create "$TAG" "$ZIP" "$DMG" --verify-tag --draft \
            --title "Exts $VERSION" --notes-file "$RUNNER_TEMP/exts-release-notes.md"
          gh release view "$TAG" --json url,tagName,isDraft,assets >> "$GITHUB_STEP_SUMMARY"
          echo '双包草稿已生成；请分别下载 ZIP 与 DMG 验收。公开 Release 并设为 Latest 后，官网固定下载入口才指向本版本。' >> "$GITHUB_STEP_SUMMARY"
