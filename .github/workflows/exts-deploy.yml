name: Exts Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择部署目标；Desktop 暂未接入发布'
        required: true
        type: choice
        default: Website
        options:
          - Website
          - Chrome
          - Desktop

permissions:
  contents: read

concurrency:
  group: exts-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  website-build:
    if: github.ref == 'refs/heads/main' && inputs.target == 'Website'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout website commit
        uses: actions/checkout@v5.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck website
        run: pnpm --filter @exts/website typecheck
      - name: Build website
        run: pnpm web:build
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist/build/exts-web

  website-deploy:
    if: github.ref == 'refs/heads/main' && inputs.target == 'Website'
    needs: website-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

  chrome-release:
    if: github.ref == 'refs/heads/main' && inputs.target == 'Chrome'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Read product version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/release/exts-chrome.zip" >> "$GITHUB_OUTPUT"
      - name: Check tag and release conflicts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | .tag_name')"
          if printf '%s\n' "$releases" | grep -Fxq "$TAG"; then
            echo "Release $TAG 已存在，禁止覆盖。失败草稿需人工检查后处理。" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            target="$(git rev-parse "$TAG^{commit}")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG 指向其他提交，禁止移动标签。" >&2
              exit 1
            fi
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release behavior
        run: node --test tests/build-release.test.mjs tests/extension-release.test.mjs
      - name: Test stable extension publication
        run: pnpm --filter @linguio/wxt-stable-output test
      - name: Test extension
        run: pnpm --filter @exts/extension test
      - name: Typecheck extension
        run: pnpm --filter @exts/extension typecheck
      - name: Build and package Chrome extension
        run: pnpm ext:release
      - name: Check bundle budget
        run: pnpm --filter @exts/extension check:bundle-size
      - name: Create tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$TAG"
          cat > "$RUNNER_TEMP/exts-release-notes.md" <<'NOTES'
          Exts 浏览器扩展：新标签页、书签、Dock 和标签组。

          下载 exts-chrome.zip 附件，解压后在 Chrome 扩展管理页开启开发者模式，选择“加载已解压的扩展程序”。经实际验收后也可在 Edge 中加载。

          此版本只包含浏览器扩展。GitHub 自动生成的 Source code 压缩包是源码，不是扩展安装包。
          NOTES
          gh release create "$TAG" "$ZIP" --verify-tag --draft \
            --title "Exts $VERSION" --notes-file "$RUNNER_TEMP/exts-release-notes.md"
          gh release view "$TAG" --json url,tagName,isDraft,assets >> "$GITHUB_STEP_SUMMARY"
          echo '草稿已生成；浏览器验收并公开 Release 后才有公开下载入口。' >> "$GITHUB_STEP_SUMMARY"

  desktop:
    if: github.ref == 'refs/heads/main' && inputs.target == 'Desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain Desktop availability
        run: |
          echo 'Desktop 发布尚未接入；本次仅展示提示，不构建、打包或上传桌面产物。'
          echo 'Desktop 发布尚未接入；没有生成或发布桌面产物。' >> "$GITHUB_STEP_SUMMARY"
