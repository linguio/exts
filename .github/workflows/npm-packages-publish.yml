name: NPM Packages Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: '选择要上传到 NPM 暂存区的公开包'
        required: true
        type: choice
        default: '@linguio/wxt-stable-output'
        options:
          - '@linguio/wxt-stable-output'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v5.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Pin NPM CLI
        run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test common release rules
        run: node --test --test-isolation=none packages/npm-release-tools/tests/publish.test.mjs
      - name: Verify and pack selected package
        id: pack
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: node packages/npm-release-tools/publish.mjs prepare "$PACKAGE_NAME"
      - name: Upload verified tarball and receipt
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npm-release-${{ github.run_id }}
          path: ${{ steps.pack.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout same commit
        uses: actions/checkout@v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/
      - name: Pin NPM CLI
        run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Download verified package
        uses: actions/download-artifact@v4.3.0
        with:
          name: npm-release-${{ github.run_id }}
          path: dist/.cache/npm-publish
      - name: Upload to NPM staging for manual approval
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "请先配置 stage-only NPM_TOKEN 仓库 Secret"
            exit 1
          fi
          node packages/npm-release-tools/publish.mjs stage "$PACKAGE_NAME" dist/.cache/npm-publish
