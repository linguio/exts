name: npm Packages Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: '完整公开包名，例如 @linguio/wxt-stable-output'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v5.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Pin npm CLI
        run: npm install --global npm@11.13.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test common release rules
        run: node --test --test-isolation=none packages/npm-release-tools/tests/publish.test.mjs
      - name: Verify and pack selected package
        id: pack
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: node packages/npm-release-tools/publish.mjs prepare "$PACKAGE_NAME"
      - name: Upload verified tarball and receipt
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npm-release-${{ github.run_id }}
          path: ${{ steps.pack.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout same commit
        uses: actions/checkout@v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.16.0
      - name: Pin npm CLI
        run: npm install --global npm@11.13.0 --ignore-scripts
      - name: Download verified package
        uses: actions/download-artifact@v4.3.0
        with:
          name: npm-release-${{ github.run_id }}
          path: dist/.cache/npm-publish
      - name: Publish using npm Trusted Publishing
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: node packages/npm-release-tools/publish.mjs publish "$PACKAGE_NAME" dist/.cache/npm-publish
